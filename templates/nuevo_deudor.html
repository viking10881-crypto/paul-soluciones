{% extends "base.html" %}

{% block title %}Nuevo Deudor | Solucione$ Paul{% endblock %}

{% block content %}

<section class="page-section">

    <div class="page-header">
        <div>
            <h1>{% if deudor %}Editar Deudor{% else %}Nuevo Deudor{% endif %}</h1>
            <p>{% if deudor %}Actualiza los datos del cliente{% else %}Registra los datos del cliente{% endif %}</p>
        </div>

        <a href="{{ url_for('deudores') }}" class="btn-small">
            ← Volver
        </a>
    </div>

    <div class="form-card">

        <form method="POST" {% if deudor %}action="{{ url_for('editar_deudor', deudor_id=deudor.id) }}"{% endif %}>

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre completo *</label>
                    <input type="text" name="nombre" placeholder="Ej: Juan Pérez" value="{{ deudor.nombre if deudor else '' }}" required>
                </div>

                <div class="form-group">
                    <label>Teléfono *</label>
                    <input type="text" name="telefono" placeholder="Ej: 3001234567" value="{{ deudor.telefono if deudor else '' }}" required>
                </div>

                <div class="form-group full">
                    <label>Referencia personal</label>
                    <input type="text" name="referencia" placeholder="Nombre y teléfono de referencia" value="{{ deudor.referencia if deudor else '' }}">
                </div>

                <div class="form-group full">
                    <label>Nota / Observación</label>
                    <textarea name="nota" rows="4" placeholder="Observaciones importantes">{{ deudor.nota if deudor else '' }}</textarea>
                </div>

            </div>

            <button type="submit" class="btn-primary">
                {% if deudor %}Actualizar Deudor{% else %}Guardar Deudor{% endif %}
            </button>

        </form>

    </div>

</section>

{% endblock %}
