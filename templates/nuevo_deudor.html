{% extends "base.html" %}

{% block title %}Nuevo Deudor | Solucione$ Paul{% endblock %}

{% block content %}

<section class="page-section">

    <div class="page-header">
        <div>
            <h1>Nuevo Deudor</h1>
            <p>Registra los datos del cliente</p>
        </div>

        <a href="{{ url_for('deudores') }}" class="btn-small">
            ← Volver
        </a>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label>Cédula</label>
                    <input type="text" name="cedula" placeholder="Ej: 123456789" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" name="telefono" placeholder="Ej: 3001234567" required>
                </div>

                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" name="correo" placeholder="Opcional">
                </div>

                <div class="form-group full">
                    <label>Dirección</label>
                    <input type="text" name="direccion" placeholder="Dirección del deudor">
                </div>

                <div class="form-group full">
                    <label>Referencia personal</label>
                    <input type="text" name="referencia" placeholder="Nombre y teléfono de referencia">
                </div>

                <div class="form-group full">
                    <label>Nota adicional</label>
                    <textarea name="nota" rows="4" placeholder="Observaciones importantes"></textarea>
                </div>

            </div>

            <button type="submit" class="btn-primary">
                Guardar Deudor
            </button>

        </form>

    </div>

</section>

{% endblock %}
