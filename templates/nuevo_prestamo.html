{% extends "base.html" %}

{% block title %}Nuevo Préstamo | Solucione$ Paul{% endblock %}

{% block content %}

<section class="page-section">

    <div class="page-header">
        <div>
            <h1>Nuevo Préstamo</h1>
            <p>Crear deuda para {{ deudor.nombre }}</p>
        </div>

        <a href="{{ url_for('detalle_deudor', deudor_id=deudor.id) }}" class="btn-small">
            ← Volver
        </a>
    </div>

    <div class="form-card">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Monto prestado</label>
                    <input type="number" name="monto" id="monto" placeholder="Ej: 1000000" required>
                </div>

                <div class="form-group">
                    <label>Número de cuotas</label>
                    <input type="number" name="numero_cuotas" id="numero_cuotas" placeholder="Ej: 5" required>
                </div>

                <div class="form-group">
                    <label>Día de pago mensual</label>
                    <input type="number" name="dia_pago" min="1" max="31" placeholder="Ej: 15" required>
                </div>

                <div class="form-group">
                    <label>Interés mensual (%)</label>
                    <input
                        type="number"
                        name="interes_mensual"
                        id="interes_mensual"
                        placeholder="Ej: 7"
                        min="0"
                        max="100"
                        step="0.1"
                        value="7"
                        required
                    >
                </div>

            </div>

            <div class="simulator-card">
                <h3>Simulación automática</h3>

                <div class="simulator-grid">
                    <div>
                        <span>Interés mensual</span>
                        <strong id="interes_preview">$0</strong>
                    </div>

                    <div>
                        <span>Capital por cuota</span>
                        <strong id="capital_preview">$0</strong>
                    </div>

                    <div>
                        <span>Cuota mensual aprox.</span>
                        <strong id="cuota_preview">$0</strong>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Crear Préstamo
            </button>

        </form>

    </div>

</section>

<script>
const montoInput    = document.getElementById("monto");
const cuotasInput   = document.getElementById("numero_cuotas");
const interesInput  = document.getElementById("interes_mensual");

const interesPreview = document.getElementById("interes_preview");
const capitalPreview = document.getElementById("capital_preview");
const cuotaPreview   = document.getElementById("cuota_preview");

function formatoCOP(valor) {
    return new Intl.NumberFormat("es-CO", {
        style: "currency",
        currency: "COP",
        maximumFractionDigits: 0
    }).format(valor || 0);
}

function calcularPreview() {
    const monto  = parseFloat(montoInput.value)   || 0;
    const cuotas = parseInt(cuotasInput.value)    || 0;
    const tasa   = parseFloat(interesInput.value) || 0;

    const interes = monto * (tasa / 100);
    const capital = cuotas > 0 ? monto / cuotas : 0;
    const cuota   = capital + interes;

    interesPreview.textContent = formatoCOP(interes);
    capitalPreview.textContent = formatoCOP(capital);
    cuotaPreview.textContent   = formatoCOP(cuota);
}

montoInput.addEventListener("input", calcularPreview);
cuotasInput.addEventListener("input", calcularPreview);
interesInput.addEventListener("input", calcularPreview);

// calcula al cargar con el valor por defecto
calcularPreview();
</script>

{% endblock %}
